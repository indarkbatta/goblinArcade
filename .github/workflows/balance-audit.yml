name: GoblinArcade Balance Audit

on:
  workflow_dispatch:
  push:
    paths:
      - "studio-data.json"
      - "GoblinArcade/**/*.lua"
      - "index.html"
      - "studio/index.html"
      - "GoblinArcade/index.html"
      - "GoblinArcade/Media/Tiles/**"
      - "api/publish.js"
      - "tools/balance_audit.py"
      - "tools/event_audit.py"
      - "tools/orc_content_audit.py"
      - "tools/ecosystem_audit.py"
      - "tools/ecosystem_runtime_audit.lua"
      - "tools/ecosystem_tile_audit.py"
      - "tools/ui_cleanup_audit.py"
      - "tools/autotile_builder_audit.py"
      - "tools/event_runtime_audit.lua"
      - "tools/event_logic_audit.lua"
      - ".github/workflows/balance-audit.yml"

permissions:
  contents: read

concurrency:
  group: goblinarcade-local-audit
  cancel-in-progress: true

jobs:
  audit:
    name: Local Windows audit
    runs-on:
      - self-hosted
      - Windows
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate or provision local Python and Node
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $pythonPath = $null
          $pythonCommand = Get-Command python.exe -ErrorAction SilentlyContinue
          if ($pythonCommand) {
            $candidate = (& $pythonCommand.Source -c "import sys; print(sys.executable)" 2>$null | Select-Object -Last 1)
            if ($LASTEXITCODE -eq 0 -and $candidate) {
              $candidate = $candidate.Trim()
              if (Test-Path $candidate) { $pythonPath = $candidate }
            }
          }

          if (-not $pythonPath) {
            $pyLauncher = Get-Command py.exe -ErrorAction SilentlyContinue
            if ($pyLauncher) {
              $candidate = (& $pyLauncher.Source -3 -c "import sys; print(sys.executable)" 2>$null | Select-Object -Last 1)
              if ($LASTEXITCODE -eq 0 -and $candidate) {
                $candidate = $candidate.Trim()
                if (Test-Path $candidate) { $pythonPath = $candidate }
              }
            }
          }

          if (-not $pythonPath) {
            $pythonVersion = "3.12.10"
            $toolRoot = if ($env:RUNNER_TOOL_CACHE) { $env:RUNNER_TOOL_CACHE } else { $env:RUNNER_TEMP }
            $pythonHome = Join-Path $toolRoot "GoblinArcadePython\$pythonVersion"
            $pythonPath = Join-Path $pythonHome "python.exe"

            if (-not (Test-Path $pythonPath)) {
              Write-Host "Local Python not found; provisioning portable Python $pythonVersion in the self-hosted runner cache."
              New-Item -ItemType Directory -Force -Path $pythonHome | Out-Null
              $pythonZip = Join-Path $env:RUNNER_TEMP "python-$pythonVersion-embed-amd64.zip"
              Invoke-WebRequest -Uri "https://www.python.org/ftp/python/$pythonVersion/python-$pythonVersion-embed-amd64.zip" -OutFile $pythonZip
              Expand-Archive -LiteralPath $pythonZip -DestinationPath $pythonHome -Force
              Remove-Item $pythonZip -Force -ErrorAction SilentlyContinue
            }
          }

          if (-not (Test-Path $pythonPath)) {
            throw "Python could not be provisioned on the self-hosted Windows runner."
          }

          $pythonDir = Split-Path -Parent $pythonPath
          $pythonDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          Write-Host "Using Python: $pythonPath"
          & $pythonPath --version
          if ($LASTEXITCODE -ne 0) { throw "Python failed to start." }

          $nodeCommand = Get-Command node.exe -ErrorAction SilentlyContinue
          $nodePath = if ($nodeCommand) { $nodeCommand.Source } else { $null }

          if (-not $nodePath) {
            $runnerRoot = Split-Path -Parent (Split-Path -Parent $env:RUNNER_TEMP)
            $nodeCandidates = Get-ChildItem -Path (Join-Path $runnerRoot "externals") -Recurse -Filter "node.exe" -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match "node24" } |
              Select-Object -First 1
            if ($nodeCandidates) { $nodePath = $nodeCandidates.FullName }
          }

          if (-not $nodePath -or -not (Test-Path $nodePath)) {
            throw "Node.js was not found on the self-hosted Windows runner."
          }

          $nodeDir = Split-Path -Parent $nodePath
          $nodeDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          Write-Host "Using Node: $nodePath"
          & $nodePath --version
          if ($LASTEXITCODE -ne 0) { throw "Node.js failed to start." }

      - name: Locate or build local Lua 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $toolRoot = if ($env:RUNNER_TOOL_CACHE) { $env:RUNNER_TOOL_CACHE } else { $env:RUNNER_TEMP }
          $luaHome = Join-Path $toolRoot "GoblinArcadeLua\5.1.5"
          $luaBin = Join-Path $luaHome "bin"
          $cachedLua = Join-Path $luaBin "lua.exe"
          $cachedLuac = Join-Path $luaBin "luac.exe"

          $luaPath = $null
          $luacPath = $null

          $systemLua = Get-Command lua.exe -ErrorAction SilentlyContinue
          $systemLuac = Get-Command luac.exe -ErrorAction SilentlyContinue
          if ($systemLua -and $systemLuac) {
            & $systemLua.Source -e "if _VERSION ~= 'Lua 5.1' then os.exit(1) end"
            if ($LASTEXITCODE -eq 0) {
              $luaPath = $systemLua.Source
              $luacPath = $systemLuac.Source
            }
          }

          if (-not $luaPath -and (Test-Path $cachedLua) -and (Test-Path $cachedLuac)) {
            & $cachedLua -e "if _VERSION ~= 'Lua 5.1' then os.exit(1) end"
            if ($LASTEXITCODE -eq 0) {
              $luaPath = $cachedLua
              $luacPath = $cachedLuac
            }
          }

          if (-not $luaPath) {
            Write-Host "Lua 5.1 not found; building Lua 5.1.5 locally with the desktop Visual Studio toolchain."

            $programFilesX86 = [Environment]::GetFolderPath("ProgramFilesX86")
            $vswhere = Join-Path $programFilesX86 "Microsoft Visual Studio\Installer\vswhere.exe"
            if (-not (Test-Path $vswhere)) {
              throw "Visual Studio vswhere.exe was not found."
            }

            $vsInstall = (& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath | Select-Object -Last 1)
            if (-not $vsInstall) {
              throw "Visual Studio C++ build tools were not found."
            }

            $vcvars = Join-Path $vsInstall "VC\Auxiliary\Build\vcvars64.bat"
            if (-not (Test-Path $vcvars)) {
              throw "vcvars64.bat was not found: $vcvars"
            }

            $buildRoot = Join-Path $env:RUNNER_TEMP "goblinarcade-lua-build"
            if (Test-Path $buildRoot) { Remove-Item $buildRoot -Recurse -Force }
            New-Item -ItemType Directory -Force -Path $buildRoot | Out-Null

            $archive = Join-Path $buildRoot "lua-5.1.5.tar.gz"
            Invoke-WebRequest -Uri "https://www.lua.org/ftp/lua-5.1.5.tar.gz" -OutFile $archive

            $env:GA_LUA_ARCHIVE = $archive
            $env:GA_LUA_BUILD_ROOT = $buildRoot
            & python -c "import os, tarfile; tarfile.open(os.environ['GA_LUA_ARCHIVE'], 'r:gz').extractall(os.environ['GA_LUA_BUILD_ROOT'])"
            if ($LASTEXITCODE -ne 0) { throw "Could not extract Lua source." }

            $src = Join-Path $buildRoot "lua-5.1.5\src"
            if (-not (Test-Path $src)) { throw "Lua source directory was not extracted." }

            $buildCmd = Join-Path $buildRoot "build-lua.cmd"
            @"
@echo off
setlocal
call "$vcvars"
if errorlevel 1 exit /b 1
cd /d "$src"
set CORE=lapi.obj lcode.obj ldebug.obj ldo.obj ldump.obj lfunc.obj lgc.obj llex.obj lmem.obj lobject.obj lopcodes.obj lparser.obj lstate.obj lstring.obj ltable.obj ltm.obj lundump.obj lvm.obj lzio.obj
set LIB=lauxlib.obj lbaselib.obj ldblib.obj liolib.obj lmathlib.obj loslib.obj ltablib.obj lstrlib.obj loadlib.obj linit.obj
for %%f in (lapi.c lcode.c ldebug.c ldo.c ldump.c lfunc.c lgc.c llex.c lmem.c lobject.c lopcodes.c lparser.c lstate.c lstring.c ltable.c ltm.c lundump.c lvm.c lzio.c lauxlib.c lbaselib.c ldblib.c liolib.c lmathlib.c loslib.c ltablib.c lstrlib.c loadlib.c linit.c lua.c luac.c print.c) do (
  cl /nologo /O2 /MD /D_CRT_SECURE_NO_WARNINGS /D_CRT_NONSTDC_NO_WARNINGS /c %%f
  if errorlevel 1 exit /b 1
)
lib /nologo /out:lua51.lib %CORE% %LIB%
if errorlevel 1 exit /b 1
cl /nologo /O2 /MD lua.obj lua51.lib /Fe:lua.exe
if errorlevel 1 exit /b 1
cl /nologo /O2 /MD luac.obj print.obj lua51.lib /Fe:luac.exe
if errorlevel 1 exit /b 1
exit /b 0
"@ | Set-Content -Path $buildCmd -Encoding ascii

            & cmd.exe /d /c $buildCmd
            if ($LASTEXITCODE -ne 0) { throw "Lua 5.1.5 local build failed." }

            New-Item -ItemType Directory -Force -Path $luaBin | Out-Null
            Copy-Item (Join-Path $src "lua.exe") $cachedLua -Force
            Copy-Item (Join-Path $src "luac.exe") $cachedLuac -Force

            $luaPath = $cachedLua
            $luacPath = $cachedLuac
          }

          $luaDir = Split-Path -Parent $luaPath
          $luaDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

          Write-Host "Using Lua: $luaPath"
          & $luaPath -v
          if ($LASTEXITCODE -ne 0) { throw "Lua failed to start." }

          Write-Host "Using luac: $luacPath"
          & $luacPath -v
          if ($LASTEXITCODE -ne 0) { throw "luac failed to start." }

      - name: Verify local audit toolchain
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          & python --version
          if ($LASTEXITCODE -ne 0) { throw "Python is not usable." }
          & node --version
          if ($LASTEXITCODE -ne 0) { throw "Node.js is not usable." }
          & lua -v
          if ($LASTEXITCODE -ne 0) { throw "Lua is not usable." }
          & luac -v
          if ($LASTEXITCODE -ne 0) { throw "luac is not usable." }

      - name: Parse addon Lua and run runtime audits
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Get-ChildItem -Path "GoblinArcade" -Recurse -Filter "*.lua" | ForEach-Object {
            & luac -p $_.FullName
            if ($LASTEXITCODE -ne 0) {
              throw "Lua syntax validation failed: $($_.FullName)"
            }
          }

          foreach ($audit in @(
            "tools/event_runtime_audit.lua",
            "tools/event_logic_audit.lua",
            "tools/ecosystem_runtime_audit.lua"
          )) {
            & luac -p $audit
            if ($LASTEXITCODE -ne 0) { throw "Lua syntax validation failed: $audit" }
            & lua $audit
            if ($LASTEXITCODE -ne 0) { throw "Lua runtime audit failed: $audit" }
          }

          foreach ($audit in @(
            "tools/ecosystem_tile_audit.py",
            "tools/ui_cleanup_audit.py",
            "tools/autotile_builder_audit.py"
          )) {
            & python $audit
            if ($LASTEXITCODE -ne 0) { throw "Python audit failed: $audit" }
          }

      - name: Validate Studio mirrors and JavaScript
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $rootHash = (Get-FileHash "index.html" -Algorithm SHA256).Hash
          $studioHash = (Get-FileHash "studio/index.html" -Algorithm SHA256).Hash
          $addonHash = (Get-FileHash "GoblinArcade/index.html" -Algorithm SHA256).Hash

          if ($rootHash -ne $studioHash -or $rootHash -ne $addonHash) {
            throw "Studio HTML mirrors are not byte-identical."
          }

          $scriptPath = Join-Path $env:RUNNER_TEMP "goblin-arcade-studio.js"
          $html = Get-Content "index.html" -Raw
          $matches = [regex]::Matches(
            $html,
            '<script(?:\s[^>]*)?>(.*?)</script>',
            [System.Text.RegularExpressions.RegexOptions]::Singleline
          )
          $scripts = $matches | ForEach-Object { $_.Groups[1].Value }
          [System.IO.File]::WriteAllText(
            $scriptPath,
            ($scripts -join [Environment]::NewLine),
            [System.Text.UTF8Encoding]::new($false)
          )

          & node --check $scriptPath
          if ($LASTEXITCODE -ne 0) { throw "Studio JavaScript syntax validation failed." }

      - name: Validate authored content
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($audit in @(
            "tools/orc_content_audit.py",
            "tools/ecosystem_audit.py",
            "tools/event_audit.py"
          )) {
            & python $audit
            if ($LASTEXITCODE -ne 0) { throw "Content audit failed: $audit" }
          }

      - name: Run balance audits
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $cases = @(
            @{ Name = "EASY";   Hp = "0.85"; Damage = "0.85" },
            @{ Name = "NORMAL"; Hp = "1.00"; Damage = "1.00" },
            @{ Name = "HARD";   Hp = "1.12"; Damage = "1.10" }
          )

          foreach ($case in $cases) {
            $report = "balance-audit-$($case.Name.ToLower()).md"
            "# $($case.Name) difficulty" | Set-Content -Path $report -Encoding utf8

            & python tools/balance_audit.py --runs 2500 --seed 5602 --difficulty-hp $case.Hp --difficulty-damage $case.Damage 2>&1 |
              Tee-Object -FilePath $report -Append
            if ($LASTEXITCODE -ne 0) {
              throw "Balance audit failed: $($case.Name)"
            }

            Get-Content $report | Add-Content -Path $env:GITHUB_STEP_SUMMARY -Encoding utf8
            "" | Add-Content -Path $env:GITHUB_STEP_SUMMARY -Encoding utf8
          }

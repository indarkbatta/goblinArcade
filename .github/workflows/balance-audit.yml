name: GoblinArcade Balance Audit

on:
  workflow_dispatch:
  push:
    paths:
      - "studio-data.json"
      - "GoblinArcade/Core.lua"
      - "GoblinArcade/EnemyGenerator.lua"
      - "GoblinArcade/FloorGenerator.lua"
      - "GoblinArcade/ItemDatabase.lua"
      - "GoblinArcade/DungeonRun.lua"
      - "tools/balance_audit.py"
      - ".github/workflows/balance-audit.yml"

jobs:
  lua-syntax:
    name: Lua syntax
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse addon Lua
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lua5.1
          find GoblinArcade -type f -name '*.lua' -print0 | xargs -0 -n1 luac5.1 -p

  balance-audit:
    name: Balance - ${{ matrix.difficulty }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - difficulty: EASY
            hp: 0.85
            damage: 0.85
          - difficulty: NORMAL
            hp: 1.00
            damage: 1.00
          - difficulty: HARD
            hp: 1.12
            damage: 1.10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run difficulty balance audit
        shell: bash
        run: |
          echo "# ${{ matrix.difficulty }} difficulty" | tee balance-audit.md
          python3 tools/balance_audit.py --runs 2500 --seed 5602 --difficulty-hp ${{ matrix.hp }} --difficulty-damage ${{ matrix.damage }} | tee -a balance-audit.md
          cat balance-audit.md >> "$GITHUB_STEP_SUMMARY"

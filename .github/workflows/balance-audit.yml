name: GoblinArcade Balance Audit

on:
  workflow_dispatch:
  push:
    paths:
      - "studio-data.json"
      - "GoblinArcade/**/*.lua"
      - "index.html"
      - "studio/index.html"
      - "GoblinArcade/index.html"
      - "studio-data.json"
      - "api/publish.js"
      - "tools/balance_audit.py"
      - "tools/event_audit.py"
      - "tools/orc_content_audit.py"
      - "tools/ecosystem_audit.py"
      - "tools/ecosystem_runtime_audit.lua"
      - "tools/ecosystem_tile_audit.py"
      - "tools/ui_cleanup_audit.py"
      - "tools/autotile_builder_audit.py"
      - "tools/event_runtime_audit.lua"
      - "tools/event_logic_audit.lua"
      - ".github/workflows/balance-audit.yml"

jobs:
  lua-syntax:
    name: Lua syntax
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse addon Lua
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lua5.1
          find GoblinArcade -type f -name '*.lua' -print0 | xargs -0 -n1 luac5.1 -p
          luac5.1 -p tools/event_runtime_audit.lua
          luac5.1 -p tools/event_logic_audit.lua
          luac5.1 -p tools/ecosystem_runtime_audit.lua
          lua5.1 tools/event_runtime_audit.lua
          lua5.1 tools/event_logic_audit.lua
          lua5.1 tools/ecosystem_runtime_audit.lua
          python3 tools/ecosystem_tile_audit.py
          python3 tools/ui_cleanup_audit.py
          python3 tools/autotile_builder_audit.py

  studio-syntax:
    name: Studio syntax
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate Studio mirrors and JavaScript
        shell: bash
        run: |
          cmp index.html studio/index.html
          cmp index.html GoblinArcade/index.html
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script(?:\s[^>]*)?>(.*?)</script>", html, flags=re.S|re.I)
          Path("/tmp/goblin-arcade-studio.js").write_text("\n".join(scripts), encoding="utf-8")
          PY
          node --check /tmp/goblin-arcade-studio.js

  monster-content:
    name: Monster content
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate authored monster database
        shell: bash
        run: python3 tools/orc_content_audit.py

  ecosystem-data:
    name: Ecosystem data
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate ecosystem coverage and references
        shell: bash
        run: python3 tools/ecosystem_audit.py

  event-data:
    name: Event data
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate data-driven dungeon events
        shell: bash
        run: python3 tools/event_audit.py

  balance-audit:
    name: Balance - ${{ matrix.difficulty }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - difficulty: EASY
            hp: 0.85
            damage: 0.85
          - difficulty: NORMAL
            hp: 1.00
            damage: 1.00
          - difficulty: HARD
            hp: 1.12
            damage: 1.10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run difficulty balance audit
        shell: bash
        run: |
          echo "# ${{ matrix.difficulty }} difficulty" | tee balance-audit.md
          python3 tools/balance_audit.py --runs 2500 --seed 5602 --difficulty-hp ${{ matrix.hp }} --difficulty-damage ${{ matrix.damage }} | tee -a balance-audit.md
          cat balance-audit.md >> "$GITHUB_STEP_SUMMARY"
